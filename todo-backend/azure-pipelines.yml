trigger:
  paths:
    include:
      - todo-backend/*

pool:
  name: Default

variables:
  acrName: sprjacrshared
  imageName: todo-backend
  dateTag: $[format('{0:yyyy}{0:MM}{0:dd}-{0:HH}{0:mm}', pipeline.startTime)]

steps:
  - pwsh: |
      Write-Host "Tamanho da variável JWT_PRIVATE_KEY: $($env:JWT_PRIVATE_KEY.Length)"
      Write-Host "Primeiros 50 chars: $($env:JWT_PRIVATE_KEY.Substring(0, [Math]::Min(50, $env:JWT_PRIVATE_KEY.Length)))"
      Write-Host "Últimos 10 chars: $($env:JWT_PRIVATE_KEY.Substring([Math]::Max(0, $env:JWT_PRIVATE_KEY.Length - 10)))"
    displayName: 'Diagnosticar JWT_PRIVATE_KEY'
    env:
      JWT_PRIVATE_KEY: $(JWT_PRIVATE_KEY)
      JWT_PUBLIC_KEY: $(JWT_PUBLIC_KEY)
    
  - task: Maven@4
    displayName: 'Build Quarkus'
    inputs:
      mavenPomFile: 'todo-backend/pom.xml'
      goals: 'package'
      options: '-DskipTests'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.25'

  - task: Docker@2
    displayName: 'Build e Push da imagem'
    inputs:
      containerRegistry: 'acr-connection'
      repository: '$(imageName)'
      command: 'buildAndPush'
      Dockerfile: 'todo-backend/Dockerfile'
      tags: |
        $(dateTag)
        latest
    env:
      DOCKER_BUILDKIT: 0