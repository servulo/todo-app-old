version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network

  backend:
    build: ./todo-backend
    container_name: todo-backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/tododb
      QUARKUS_DATASOURCE_USERNAME: todo
      QUARKUS_DATASOURCE_PASSWORD: todo123
      CORS_ALLOWED_ORIGIN: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - todo-network

  frontend:
    build: ./todo-frontend
    container_name: todo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data: