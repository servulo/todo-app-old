<div class="container">
  <h2>Login</h2>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <input
    type="text"
    placeholder="E-mail"
    [(ngModel)]="email"
  />

  <input
    type="text"
    placeholder="Senha"
    [(ngModel)]="password"
  />

  <button (click)="login()">Entrar</button>
</div>
