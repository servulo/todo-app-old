server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass https://sprj-ca-todo-backend.salmonhill-9ed0043a.brazilsouth.azurecontainerapps.io;
        proxy_set_header Host sprj-ca-todo-backend.salmonhill-9ed0043a.brazilsouth.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
    }
}